<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Confeita Mais | Links</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Creepster&display=swap" rel="stylesheet">

<style>
:root{
  --dark:#1B0E2B;
  --purple:#3D1E63;
  --purple-deep:#2A1247;
  --purple-light:#5B3389;
  --orange:#FF7A1A;
  --orange-deep:#E8590C;
  --orange-glow:#FFA85C;
  --slime:#7ED957;
  --slime-deep:#4E9A2C;
  --cream:#FBF3E8;
  --white:#fff;
  --gold:#F2A93B;
  --gold-soft:#F7CE8A;
  --web:#F0E6D2;

  --shadow-card: 0 30px 70px -15px rgba(0,0,0,.6), 0 10px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
  --shadow-btn: 0 8px 20px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.25);
  --shadow-btn-hover: 0 14px 30px rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.3);
  --ease-soft: cubic-bezier(.22,.8,.28,1);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}

html, body{
  overflow-x:hidden;
}

body{
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(ellipse 260px 260px at 82% 8%, rgba(255,245,210,.16), transparent 62%),
    radial-gradient(circle at 12% 6%, rgba(255,255,255,.07), transparent 42%),
    radial-gradient(circle at 90% 88%, rgba(126,217,87,.06), transparent 50%),
    linear-gradient(160deg,var(--orange-deep),var(--purple) 52%,var(--dark) 128%);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  position:relative;
  isolation:isolate;
}

/* leve textura de grão para tirar o "flat" do fundo */
body::after{
  content:'';
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.05;
  mix-blend-mode:overlay;
  background-image:
    radial-gradient(circle, #fff 1px, transparent 1px);
  background-size:3px 3px;
}

/* ---------- LUA ---------- */
.lua{
  position:fixed;
  top:6%;
  right:8%;
  width:72px;
  height:72px;
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #FFFBEF, #F7CE8A 52%, #D9A85C 100%);
  box-shadow:
    0 0 2px 1px rgba(255,251,235,.5),
    0 0 46px 12px rgba(242,169,59,.4),
    0 0 100px 34px rgba(242,169,59,.14);
  z-index:0;
  pointer-events:none;
  animation:luaPulsa 7s ease-in-out infinite;
}
.lua::before,
.lua::after{
  content:'';
  position:absolute;
  border-radius:50%;
  background:rgba(180,148,90,.4);
}
.lua::before{ width:16px; height:16px; top:15px; left:13px; box-shadow: 0 0 4px rgba(0,0,0,.08) inset; }
.lua::after{ width:10px; height:10px; top:39px; left:37px; box-shadow: -7px 15px 0 -1px rgba(180,148,90,.32); }
@keyframes luaPulsa{
  0%,100%{ filter:brightness(1) saturate(1); }
  50%{ filter:brightness(1.15) saturate(1.08); }
}

/* ---------- TEIAS DE CANTO ---------- */
.teia-canto{
  position:fixed;
  width:150px;
  height:150px;
  z-index:1;
  pointer-events:none;
  opacity:.5;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.45));
}
.teia-tl{ top:-18px; left:-18px; }
.teia-tr{ top:-18px; right:-18px; transform:scaleX(-1); }

@media(max-width:480px){
  .teia-canto{ width:100px; height:100px; }
}

/* ---------- ARANHA PENDURADA (longe do chapéu, canto superior esquerdo) ---------- */
.aranha-fio{
  position:fixed;
  top:0;
  left:16%;
  width:1px;
  height:0;
  background:linear-gradient(var(--web), rgba(240,230,210,.12));
  z-index:5;
  pointer-events:none;
  animation:fioDesce 1.8s var(--ease-soft) forwards, fioBalanca 4.8s ease-in-out 1.8s infinite;
  transform-origin:top center;
}
@keyframes fioDesce{
  from{ height:0; }
  to{ height:78px; }
}
@keyframes fioBalanca{
  0%,100%{ transform:rotate(-5deg); }
  50%{ transform:rotate(5deg); }
}
.aranha{
  position:fixed;
  top:70px;
  left:16%;
  transform:translateX(-50%);
  width:34px;
  height:34px;
  z-index:5;
  pointer-events:none;
  opacity:0;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.55));
  animation:aranhaAparece .7s var(--ease-soft) 1.7s forwards, fioBalanca 4.8s ease-in-out 1.8s infinite;
}
@keyframes aranhaAparece{
  to{ opacity:1; }
}

/* ---------- MORCEGOS VOANDO ---------- */
.morcego{
  position:fixed;
  width:26px;
  height:16px;
  z-index:1;
  pointer-events:none;
  opacity:0;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));
  animation:voarMorcego linear infinite;
}
.m1{ top:22%; animation-duration:13s; animation-delay:.5s; }
.m2{ top:68%; animation-duration:17s; animation-delay:4s; }
.m3{ top:42%; animation-duration:15s; animation-delay:8s; }
.m4{ top:12%; animation-duration:19s; animation-delay:2.5s; }
.m5{ top:80%; animation-duration:14s; animation-delay:10.5s; }
.m6{ top:50%; animation-duration:16s; animation-delay:6.5s; z-index:3; }
.m7{ top:57%; animation-duration:18s; animation-delay:13s; z-index:3; }

@keyframes voarMorcego{
  0%{ transform:translateX(-8vw) translateY(0) scale(.9); opacity:0; }
  8%{ opacity:.85; }
  25%{ transform:translateX(28vw) translateY(-18px) scale(1); }
  50%{ transform:translateX(58vw) translateY(6px) scale(.95); }
  75%{ transform:translateX(88vw) translateY(-14px) scale(1); }
  92%{ opacity:.85; }
  100%{ transform:translateX(112vw) translateY(0) scale(.9); opacity:0; }
}

/* ---------- ABOBORAS FLUTUANTES ---------- */
.abobora-flutuante{
  position:fixed;
  z-index:1;
  pointer-events:none;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.45));
  animation:flutuar 4.8s ease-in-out infinite;
}
.ab1{ bottom:6%; left:4%; width:46px; animation-delay:.3s; }
.ab2{ top:18%; left:2%; width:30px; animation-delay:1.6s; opacity:.85; }
.ab3{ bottom:9%; right:4%; width:38px; animation-delay:1s; }

@keyframes flutuar{
  0%,100%{ transform:translateY(0) rotate(-3deg); }
  50%{ transform:translateY(-13px) rotate(3deg); }
}

@media(max-width:480px){
  .ab1{ width:34px; }
  .ab2{ width:22px; }
  .ab3{ width:28px; }
  .lua{ width:50px; height:50px; top:4%; right:6%; }
}

/* ---------- CARD ---------- */
.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 18%),
    linear-gradient(180deg,var(--purple) 0%,var(--purple-deep) 100%);
  border-radius:38px;
  padding:0 25px 32px;
  text-align:center;
  box-shadow:var(--shadow-card);
  animation:fadeUp 1s var(--ease-soft);
  overflow:hidden;
  border:1px solid rgba(255,122,26,.22);
}

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(44px) scale(.98); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}

.teia-card{
  position:absolute;
  top:0;
  right:14px;
  width:70px;
  height:70px;
  z-index:1;
  opacity:.45;
  pointer-events:none;
}

.logo-container{
  position:relative;
  z-index:5;
  width:140px;
  height:140px;
  margin:36px auto 22px;
  border-radius:50%;
  padding:6px;
  background:conic-gradient(from 200deg, var(--gold-soft), var(--orange), var(--gold-soft));
  box-shadow:
    0 14px 30px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.06) inset;
  cursor:pointer;
  transition:transform .4s var(--ease-soft);
}
.logo-container:hover{
  transform:scale(1.03) rotate(-1deg);
}

.logo-container img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:white;
  border:4px solid var(--dark);
}

/* ---------- CHAPEU DE BRUXA no logo (parado, mais encaixado) ---------- */
.chapeu-bruxa{
  position:absolute;
  top:-38px;
  left:50%;
  transform:translateX(-50%) rotate(-6deg);
  width:88px;
  z-index:6;
  filter:drop-shadow(0 7px 9px rgba(0,0,0,.55));
}

/* Efeito de clarão de relâmpago cobrindo a cena */
.clarao{
  position:fixed;
  inset:0;
  z-index:8;
  pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(224,222,255,.55) 42%, rgba(224,222,255,.12) 100%);
  opacity:0;
  mix-blend-mode:screen;
  animation:relampago 3s linear infinite;
}
@keyframes relampago{
  0%, 79.2%{ opacity:0; }
  79.4%{ opacity:.95; }
  79.6%{ opacity:.1; }
  79.9%{ opacity:.75; }
  80.3%{ opacity:0; }
  85%{ opacity:0; }
  85.15%{ opacity:.5; }
  85.4%{ opacity:0; }
  100%{ opacity:0; }
}

/* ---------- CHAPEUS MINI nos atendentes (parados, mais encaixados) ---------- */
.mini-chapeu{
  position:absolute;
  top:-24px;
  left:50%;
  transform:translateX(-50%) rotate(-6deg);
  width:46px;
  z-index:4;
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.5));
  pointer-events:none;
}

h1{
  font-family:'Creepster',cursive;
  font-size:42px;
  font-weight:400;
  color:var(--gold);
  line-height:1.25;
  padding:2px 0 8px;
  letter-spacing:1.5px;
  background:linear-gradient(180deg, var(--gold-soft), var(--gold) 60%, var(--orange-deep));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.4)) drop-shadow(0 0 22px rgba(255,122,26,.3));
  position:relative;
}

.subtitle{
  color:var(--cream);
  font-size:12px;
  letter-spacing:1.5px;
  font-weight:500;
  margin-bottom:22px;
  opacity:.82;
}

.selo{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(160deg, #241035, var(--dark));
  color:var(--gold-soft);
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.2px;
  padding:9px 22px;
  border-radius:999px;
  margin:24px 0 15px;
  box-shadow:0 6px 14px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  border:1px solid rgba(255,122,26,.28);
}

.atendentes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:24px;
}

.alisson{
  grid-column:1 / 3;
  max-width:180px;
  margin:auto;
}

.atendente{
  background:linear-gradient(160deg,var(--dark),#150a22);
  border-radius:22px;
  padding:36px 12px 18px;
  cursor:pointer;
  transition:transform .4s var(--ease-soft), box-shadow .4s var(--ease-soft), border-color .4s var(--ease-soft);
  border:2px solid rgba(255,122,26,.22);
  box-shadow:0 8px 18px rgba(0,0,0,.4);
  position:relative;
  overflow:hidden;
}

.atendente::before{
  content:'';
  position:absolute;
  width:120%;
  height:120%;
  background:linear-gradient(45deg,transparent,rgba(255,255,255,.14),transparent);
  top:-120%;
  left:-120%;
  transition:.65s var(--ease-soft);
}

.atendente:hover::before{
  top:100%;
  left:100%;
}

.atendente:hover{
  transform:translateY(-6px) scale(1.035);
  background:linear-gradient(160deg,#241035,var(--dark));
  border-color:var(--orange);
  box-shadow:0 16px 32px rgba(255,122,26,.28), 0 4px 10px rgba(0,0,0,.4);
}

.atendente:active{
  transform:translateY(-2px) scale(1.01);
}

.atendente:focus-visible,
.btn:focus-visible{
  outline:3px solid var(--orange);
  outline-offset:2px;
}

.choc-drip{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:78px;
  z-index:1;
  pointer-events:none;
  overflow:visible;
  transform:translateY(-1px);
}

.mini-abobora{
  position:absolute;
  top:6px;
  right:8px;
  width:20px;
  z-index:3;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));
  opacity:.9;
}

.avatar-wrap{
  position:relative;
  z-index:2;
  width:80px;
  height:80px;
  margin:0 auto 11px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,var(--gold-soft),var(--orange));
  box-shadow:0 6px 14px rgba(0,0,0,.35);
  transition:transform .4s var(--ease-soft);
}
.atendente:hover .avatar-wrap{
  transform:scale(1.06);
}

.atendente img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--dark);
  display:block;
}

.atendente span{
  display:block;
  color:var(--cream);
  font-size:13.5px;
  font-weight:600;
  line-height:1.35;
  letter-spacing:.1px;
}

.btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-decoration:none;
  padding:15px 18px;
  border-radius:18px;
  margin-bottom:13px;
  font-weight:600;
  font-size:14.5px;
  letter-spacing:.15px;
  transition:transform .3s var(--ease-soft), box-shadow .3s var(--ease-soft), filter .3s ease;
  position:relative;
}

.btn-icon{
  width:19px;
  height:19px;
  min-width:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold-soft);
}
.btn-icon svg{ width:100%; height:100%; }

.btn-main{
  background:linear-gradient(135deg,var(--orange-deep),#7a2b06);
  color:var(--cream);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--shadow-btn);
}
.btn-main:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-btn-hover), 0 0 22px rgba(255,122,26,.3);
  filter:brightness(1.06);
}
.btn-main:active{
  transform:translateY(-1px);
}

.btn-google{
  background:linear-gradient(135deg,var(--orange-deep),#7a2b06);
  color:var(--cream);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--shadow-btn);
}
.btn-google:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-btn-hover), 0 0 22px rgba(255,122,26,.3);
  filter:brightness(1.06);
}

.google-icon{
  width:18px;
}

.btn-cnpj{
  background:linear-gradient(135deg,var(--dark),#0c0512);
  color:var(--white);
  border:1px solid var(--slime);
  box-shadow:0 8px 20px rgba(0,0,0,.45);
}
.btn-cnpj .btn-icon{ color:var(--slime); }
.btn-cnpj:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 32px rgba(126,217,87,.28), 0 4px 10px rgba(0,0,0,.4);
  filter:brightness(1.08);
}

footer{
  margin-top:24px;
  padding-top:17px;
  border-top:1px dashed rgba(255,122,26,.32);
  font-size:10px;
  color:var(--cream);
  opacity:.72;
  letter-spacing:1.2px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
footer svg{ width:12px; height:12px; opacity:.7; }

/* ---------- CONFETE HALLOWEEN (bonus visual em cliques) ---------- */
.confete-hw{
  position:fixed;
  pointer-events:none;
  z-index:9999;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
}

@media(max-width:480px){
  .card{
    border-radius:28px;
    padding:0 20px 28px;
  }
  h1{
    font-size:38px;
  }
  .chapeu-bruxa{ width:74px; top:-32px; }
  .mini-chapeu{ width:38px; top:-20px; }
  .morcego{ width:20px; height:13px; }
  .atendentes{ gap:12px; }
}
</style>
</head>

<script>
function enviarZap(numero,nome){
  const msg = encodeURIComponent(
    `Olá ${nome}! Gostaria de informações sobre os produtos da Confeita Mais 🍫🍰`
  );
  window.open(`https://wa.me/${numero}?text=${msg}`,'_blank');
}

// Confetes tema Halloween (abobora, morcego, teia) ao clicar
const HW_ICONS = ['🎃','🦇','🕸️','🍬','👻'];

function explodirConfetes(x,y){
  const qtd = 16;

  for(let i=0;i<qtd;i++){
    const c = document.createElement('div');
    c.className = 'confete-hw';
    c.textContent = HW_ICONS[Math.floor(Math.random()*HW_ICONS.length)];
    c.style.left = x+'px';
    c.style.top = y+'px';
    c.style.fontSize = (12+Math.random()*10)+'px';
    c.style.opacity='1';

    const angulo = Math.random()*2*Math.PI;
    const distancia = 60 + Math.random()*100;
    const destinoX = Math.cos(angulo)*distancia;
    const destinoY = Math.sin(angulo)*distancia - 50;
    const rotacao = (Math.random()*720)-360;

    document.body.appendChild(c);

    c.animate([
      { transform:'translate(0,0) rotate(0deg) scale(1)', opacity:1 },
      { transform:`translate(${destinoX}px, ${destinoY}px) rotate(${rotacao}deg) scale(.6)`, opacity:0 }
    ], {
      duration: 750 + Math.random()*450,
      easing:'cubic-bezier(.25,.8,.25,1)'
    });

    setTimeout(()=>c.remove(), 1300);
  }
}

document.querySelectorAll('.btn, .atendente').forEach(el=>{
  el.addEventListener('click', function(e){
    const touch = e.changedTouches ? e.changedTouches[0] : e;
    explodirConfetes(touch.clientX, touch.clientY);
  });
});

// Piscar aleatório de "olhos" na abobora do logo ao passar o mouse/tocar (leve easter egg)
document.querySelector('.logo-container').addEventListener('click', function(e){
  const rect = this.getBoundingClientRect();
  explodirConfetes(rect.left+rect.width/2, rect.top+rect.height/2);
});
</script>
