<title>Confeita Mais | Links</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --brown-dark:#3B2A1C;
  --brown:#5A3A22;
  --caramel:#E0A868;
  --caramel-deep:#D98F3E;
  --caramel-soft:#D4A373;
  --cream:#FDF8F3;
  --white:#fff;
  --gold:#C9A227;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 8%, rgba(255,255,255,.08), transparent 45%),
    linear-gradient(160deg,var(--caramel-deep),var(--caramel) 55%,var(--brown-dark) 130%);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  overflow-x:hidden;
  position:relative;
}

.twinkle{
  position:fixed;
  opacity:.55;
  animation:piscar 3.4s ease-in-out infinite;
  pointer-events:none;
  z-index:0;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));
}
.t1{ top:9%; left:7%; width:26px; height:26px; animation-delay:.2s; }
.t2{ top:14%; right:8%; width:18px; height:18px; animation-delay:1.4s; }
.t3{ bottom:12%; left:8%; width:20px; height:20px; animation-delay:.8s; }
.t4{ bottom:16%; right:7%; width:28px; height:28px; animation-delay:2.1s; }

@keyframes piscar{
  0%,100%{ opacity:.25; transform:scale(.85) rotate(0deg); }
  50%{ opacity:.75; transform:scale(1.05) rotate(8deg); }
}

.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,var(--caramel) 0%,var(--caramel-deep) 100%);
  border-radius:40px;
  padding:0 25px 30px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  animation:fadeUp .9s ease;
  overflow:hidden;
}

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(40px); }
  to{ opacity:1; transform:translateY(0); }
}

.onda-topo{
  position:relative;
  width:100%;
  height:150px;
  margin-bottom:-58px;
}
.onda-topo svg{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:100%;
}
.onda-topo .estrela-onda{
  position:absolute;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
}
.eo1{ top:22px; left:14%; width:20px; opacity:.9; }
.eo2{ top:46px; right:12%; width:14px; opacity:.85; }

.logo-container{
  position:relative;
  z-index:5;
  width:140px;
  height:140px;
  margin:34px auto 20px;
  border-radius:50%;
  padding:6px;
  background:linear-gradient(135deg,var(--gold),var(--caramel-soft));
  box-shadow:0 12px 26px rgba(59,42,28,.35);
}

.logo-container img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:white;
  border:4px solid var(--cream);
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:46px;
  color:var(--brown-dark);
  line-height:1.3;
  padding:2px 0 6px;
}

.subtitle{
  color:var(--brown);
  font-size:11.5px;
  letter-spacing:2px;
  font-weight:600;
  text-transform:uppercase;
  margin-bottom:20px;
  opacity:.85;
}

.selo{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--white);
  color:var(--brown-dark);
  font-size:12px;
  font-weight:700;
  letter-spacing:.3px;
  padding:9px 20px;
  border-radius:999px;
  margin:22px 0 14px;
  box-shadow:0 4px 10px rgba(59,42,28,.15);
}

.atendentes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-bottom:22px;
}

.alisson{
  grid-column:1 / 3;
  max-width:180px;
  margin:auto;
}

.atendente{
  background:linear-gradient(160deg,var(--cream),#fff);
  border-radius:24px;
  padding:34px 12px 16px;
  cursor:pointer;
  transition:.35s cubic-bezier(.2,.8,.3,1);
  border:2px solid rgba(255,255,255,.6);
  box-shadow:0 6px 16px rgba(59,42,28,.15);
  position:relative;
  overflow:hidden;
}

.atendente::before{
  content:'';
  position:absolute;
  width:120%;
  height:120%;
  background:linear-gradient(45deg,transparent,rgba(255,255,255,.6),transparent);
  top:-120%;
  left:-120%;
  transition:.6s;
}

.atendente:hover::before{
  top:100%;
  left:100%;
}

.atendente:hover{
  transform:translateY(-5px) scale(1.03);
  background:linear-gradient(160deg,#fff,var(--cream));
  border-color:var(--gold);
  box-shadow:0 12px 26px rgba(59,42,28,.25);
}

.atendente:focus-visible,
.btn:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:2px;
}

.choc-drip{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:78px;
    z-index:1;
    pointer-events:none;
    overflow:visible;
    transform:translateY(-1px);
  }

.avatar-wrap{
  position:relative;
  z-index:2;
  width:80px;
  height:80px;
  margin:0 auto 10px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,var(--gold),var(--caramel));
}

.atendente img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--cream);
  display:block;
}

.atendente span{
  display:block;
  color:var(--brown-dark);
  font-size:13.5px;
  font-weight:700;
  line-height:1.3;
}

.btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-decoration:none;
  padding:14px 18px;
  border-radius:20px;
  margin-bottom:12px;
  font-weight:600;
  font-size:14.5px;
  letter-spacing:.1px;
  transition:.25s ease;
  position:relative;
}

.btn-icon{
  width:19px;
  height:19px;
  min-width:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold);
}
.btn-icon svg{ width:100%; height:100%; }

.btn-main{
  background:linear-gradient(135deg,var(--brown),var(--brown-dark));
  color:var(--cream);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 6px 16px rgba(59,42,28,.3);
}
.btn-main:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(59,42,28,.4);
}

.btn-google{
  background:linear-gradient(135deg,var(--brown),var(--brown-dark));
  color:var(--cream);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 6px 16px rgba(59,42,28,.3);
}
.btn-google:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(59,42,28,.4);
}

.google-icon{
  width:18px;
}

.btn-cnpj{
  background:linear-gradient(135deg,var(--brown-dark),#2c1f14);
  color:var(--white);
  border:1px solid var(--gold);
  box-shadow:0 6px 18px rgba(0,0,0,.3);
}
.btn-cnpj .btn-icon{ color:var(--gold); }
.btn-cnpj:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(0,0,0,.35);
}

footer{
  margin-top:22px;
  padding-top:16px;
  border-top:1px dashed rgba(59,42,28,.3);
  font-size:10px;
  color:var(--brown-dark);
  opacity:.75;
  letter-spacing:1px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
footer svg{ width:12px; height:12px; opacity:.7; }

@media(max-width:480px){
  .card{
    border-radius:30px;
    padding:0 20px 26px;
  }
  h1{
    font-size:40px;
  }
}
</style>
</head>

    `Olá ${nome}! Gostaria de informações sobre os produtos da Confeita Mais 🍫🍰`
  );
  window.open(`https://wa.me/${numero}?text=${msg}`,'_blank');
}

function explodirConfetes(x,y){
  const cores = ['#3B2A1C','#E0A868','#D4A373','#C9A227','#ffffff'];
  const qtd = 18;

  for(let i=0;i<qtd;i++){
    const c = document.createElement('div');
    c.style.position='fixed';
    c.style.left = x+'px';
    c.style.top = y+'px';
    c.style.width = (5+Math.random()*5)+'px';
    c.style.height = (8+Math.random()*6)+'px';
    c.style.background = cores[Math.floor(Math.random()*cores.length)];
    c.style.borderRadius='2px';
    c.style.pointerEvents='none';
    c.style.zIndex='9999';
    c.style.opacity='1';

    const angulo = Math.random()*2*Math.PI;
    const distancia = 60 + Math.random()*90;
    const destinoX = Math.cos(angulo)*distancia;
    const destinoY = Math.sin(angulo)*distancia - 40;
    const rotacao = Math.random()*360;

    document.body.appendChild(c);

    c.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:1 },
      { transform:`translate(${destinoX}px, ${destinoY}px) rotate(${rotacao}deg)`, opacity:0 }
    ], {
      duration: 700 + Math.random()*400,
      easing:'cubic-bezier(.25,.8,.25,1)'
    });

    setTimeout(()=>c.remove(), 1200);
  }
}

document.querySelectorAll('.btn, .atendente').forEach(el=>{
  el.addEventListener('click', function(e){
    explodirConfetes(e.clientX, e.clientY);
  });
});
</script>
