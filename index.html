<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Confeita Mais | Links</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{

  --cacau:#563C19;          
  --cacau-escuro:#3B2711;   
  --cacau-medio:#664820;    
  --caramelo:#F0A456;       
  --caramelo-claro:#F7C58B;
  --dourado:#D9A441;
  --creme:#FFF6E9;
  --branco:#FFFFFF;

  --ease:cubic-bezier(.22,.8,.28,1);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}

html, body{ overflow-x:hidden; }

body{
  min-height:100vh;
  min-height:100dvh;
  background:var(--cacau-escuro);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  position:relative;
  isolation:isolate;
  color:var(--creme);
}


  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}
.fundo-desktop{ display:none; }
@media(min-width:761px){
  .fundo-mobile{ display:none; }
  .fundo-desktop{ display:block; }
}
.fita{
  fill:none;
  stroke:var(--caramelo);
  stroke-width:74;
  stroke-linecap:butt;
  opacity:.92;
}

.estrela{
  position:fixed;
  z-index:1;
  pointer-events:none;
  background:var(--branco);
  clip-path:polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
  animation:brilha 5s ease-in-out infinite;
}
.e1{ top:9%;  left:9%;  width:44px; height:44px; }
.e2{ top:15%; right:11%; width:22px; height:22px; background:var(--caramelo-claro); animation-delay:1.4s; }
.e3{ bottom:12%; left:12%; width:24px; height:24px; background:var(--caramelo-claro); animation-delay:2.6s; }
.e4{ bottom:9%; right:8%; width:40px; height:40px; animation-delay:.8s; }

@keyframes brilha{
  0%,100%{ transform:scale(1) rotate(0deg); opacity:.95; }
  50%{ transform:scale(.8) rotate(12deg); opacity:.6; }
}

@media(max-width:480px){
  .e1{ width:30px; height:30px; }
  .e4{ width:28px; height:28px; }
}


.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  background:var(--cacau);
  border-radius:32px;
  padding:34px 24px 28px;
  text-align:center;
  border:1px solid rgba(240,164,86,.38);
  box-shadow:0 30px 70px -18px rgba(0,0,0,.55), 0 10px 24px rgba(0,0,0,.3);
  animation:entrada .9s var(--ease);
}
@keyframes entrada{
  from{ opacity:0; transform:translateY(36px); }
  to{ opacity:1; transform:translateY(0); }
}

.logo{
  display:block;
  width:min(300px,86%);
  height:auto;
  margin:0 auto 6px;
  cursor:pointer;
}

h1{
  position:absolute;
  width:1px; height:1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
}

.slogan{
  color:var(--creme);
  font-size:14px;
  font-weight:500;
  line-height:1.5;
  margin:0 auto 26px;
  max-width:260px;
  opacity:.92;
}


.secao{
  display:flex;
  align-items:center;
  gap:12px;
  margin:26px 0 14px;
  color:var(--caramelo);
  font-size:14px;
  font-weight:600;
  letter-spacing:.2px;
}
.secao::before,
.secao::after{
  content:'';
  flex:1;
  height:1px;
  background:rgba(240,164,86,.4);
}


.atendentes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.personalizados{
  grid-column:1 / 3;
  width:calc(50% - 7px);
  margin:0 auto;
}

.atendente{
  background:var(--cacau-escuro);
  border-radius:22px;
  padding:20px 12px 16px;
  cursor:pointer;
  border:1.5px solid rgba(240,164,86,.32);
  transition:transform .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease);
}
.atendente:hover{
  transform:translateY(-4px);
  border-color:var(--caramelo);
  background:#442D12;
}
.atendente:active{ transform:translateY(-1px); }

.avatar{
  width:80px;
  height:80px;
  margin:0 auto 12px;
  border-radius:50%;
  padding:3px;
  background:var(--caramelo);
}
.avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--cacau-escuro);
  display:block;
  background:var(--creme);
}
.atendente span{
  display:block;
  color:var(--creme);
  font-size:13.5px;
  font-weight:600;
  line-height:1.35;
}


.btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-decoration:none;
  padding:15px 18px;
  border-radius:16px;
  margin-bottom:12px;
  font-weight:600;
  font-size:14.5px;
  transition:transform .25s var(--ease), background .25s var(--ease), border-color .25s var(--ease);
}
.btn:hover{ transform:translateY(-3px); }
.btn:active{ transform:translateY(-1px); }

.btn-icon{
  width:19px;
  height:19px;
  min-width:19px;
  display:flex;
}
.btn-icon svg{ width:100%; height:100%; }


.btn-principal{
  background:var(--caramelo);
  color:var(--cacau-escuro);
  border:1.5px solid var(--caramelo);
  font-weight:700;
}
.btn-principal:hover{ background:var(--caramelo-claro); border-color:var(--caramelo-claro); }


.btn-sec{
  background:var(--cacau-escuro);
  color:var(--creme);
  border:1.5px solid rgba(240,164,86,.5);
}
.btn-sec:hover{ border-color:var(--caramelo); background:#442D12; }
.btn-sec .btn-icon{ color:var(--caramelo); }

.google-icon{
  width:18px;
  height:18px;
  background:var(--branco);
  border-radius:50%;
  padding:2px;
}

.atendente:focus-visible,
.btn:focus-visible,
.logo:focus-visible{
  outline:3px solid var(--creme);
  outline-offset:3px;
}

footer{
  margin-top:24px;
  padding-top:16px;
  border-top:1px solid rgba(240,164,86,.28);
  font-size:10.5px;
  color:var(--creme);
  opacity:.7;
  letter-spacing:.6px;
}

/* ---------- ESTRELAS AO CLICAR ---------- */
.brilho{
  position:fixed;
  pointer-events:none;
  z-index:9999;
  clip-path:polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
}

@media(max-width:480px){
  body{ padding:14px; }
  .card{ border-radius:28px; padding:28px 18px 24px; }
  .atendentes{ gap:12px; }
  .personalizados{ width:calc(50% - 6px); }
}
</style>
</head>

<script>
function enviarZap(numero,nome){
  const msg = encodeURIComponent(
    `Olá ${nome}! Gostaria de informações sobre os produtos da Confeita Mais 🍰`
  );
  window.open(`https://wa.me/${numero}?text=${msg}`,'_blank');
}

// Estrelinhas da marca ao clicar
const CORES = ['#FFFFFF','#F0A456','#F7C58B'];

function brilhos(x,y){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i=0;i<10;i++){
    const s = document.createElement('div');
    const tam = 10 + Math.random()*12;
    s.className = 'brilho';
    s.style.width = s.style.height = tam+'px';
    s.style.left = (x - tam/2)+'px';
    s.style.top = (y - tam/2)+'px';
    s.style.background = CORES[Math.floor(Math.random()*CORES.length)];
    document.body.appendChild(s);

    const ang = Math.random()*2*Math.PI;
    const dist = 50 + Math.random()*80;
    s.animate([
      { transform:'translate(0,0) rotate(0deg) scale(1)', opacity:1 },
      { transform:`translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px) rotate(${Math.random()*180}deg) scale(.3)`, opacity:0 }
    ], { duration: 650 + Math.random()*350, easing:'cubic-bezier(.25,.8,.25,1)' });
    setTimeout(()=>s.remove(), 1100);
  }
}

document.querySelectorAll('.btn, .atendente, .logo').forEach(el=>{
  el.addEventListener('click', function(e){
    brilhos(e.clientX, e.clientY);
  });
});
</script>
